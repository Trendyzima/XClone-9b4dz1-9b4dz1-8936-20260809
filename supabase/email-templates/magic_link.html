<div style="font-family:Arial,sans-serif;max-width:560px;margin:0 auto;padding:32px;color:#111827">
  <div style="text-align:center;margin-bottom:24px">
    <div style="display:inline-flex;width:64px;height:64px;border-radius:50%;background:#16a34a;color:#fff;align-items:center;justify-content:center;font-size:30px;font-weight:700">T</div>
  </div>

  <h1 style="font-size:24px;text-align:center;margin:0 0 12px">Your Testagram verification code</h1>
  <p style="font-size:16px;line-height:1.6;text-align:center;color:#4b5563">
    Enter this code on Testagram to finish creating your account.
  </p>

  <div style="font-size:36px;letter-spacing:10px;font-weight:700;text-align:center;padding:20px 12px;margin:24px 0;background:#f3f4f6;border-radius:14px;color:#111827">
    {{ .Token }}
  </div>

  <p style="font-size:14px;line-height:1.6;text-align:center;color:#6b7280">
    This code expires shortly and can only be used once. If you did not request it, you can safely ignore this email.
  </p>

  <div style="text-align:center;margin-top:24px">
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 22px;border-radius:999px;background:#16a34a;color:#fff;text-decoration:none;font-weight:700">
      Continue to Testagram
    </a>
  </div>

  <p style="font-size:12px;text-align:center;color:#9ca3af;margin-top:28px">
    Testagram · <a href="https://testagram.site" style="color:#16a34a">testagram.site</a>
  </p>
</div>
