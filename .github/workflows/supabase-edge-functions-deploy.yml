name: Testagram Supabase Edge Functions Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-edge-functions-deploy.yml'

permissions:
  contents: read

concurrency:
  group: testagram-supabase-edge-functions
  cancel-in-progress: false

jobs:
  deploy-edge-functions:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_REF: aepbqfrmheihfsauzcby
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate deployment credentials
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN.'; exit 1; }
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) echo 'Supabase personal access token format detected.' ;;
            *) echo 'SUPABASE_ACCESS_TOKEN is not a Supabase personal access token.'; exit 1 ;;
          esac

      - name: Verify target project access
        run: |
          set -euo pipefail
          status_code="$(curl -sS -o "$RUNNER_TEMP/supabase-project.json" -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")"
          test "$status_code" = 200 || {
            echo "Supabase project access failed with HTTP $status_code."
            cat "$RUNNER_TEMP/supabase-project.json" || true
            exit 1
          }

      - name: Install Supabase CLI
        run: npm install --global supabase@latest

      # Database migrations are deliberately not run here. Production schema changes
      # are serialized by supabase-production-migrate.yml using the DB password and
      # the immutable release SHA. Keeping schema and function deployment separate
      # prevents a fine-grained Edge Functions token from being forced through the
      # Management API database/link endpoints.
      - name: Deploy gateway-relay Edge Function
        run: supabase functions deploy gateway-relay --use-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy federation-transport Edge Function
        run: supabase functions deploy federation-transport --use-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy federation-inbox Edge Function
        run: supabase functions deploy federation-inbox --use-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy federation-delivery-worker Edge Function
        run: supabase functions deploy federation-delivery-worker --use-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy search-everything Edge Function
        run: supabase functions deploy search-everything --use-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy feed-fast Edge Function
        run: supabase functions deploy feed-fast --use-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy post-create Edge Function
        run: supabase functions deploy post-create --use-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy media-upload Edge Function
        run: supabase functions deploy media-upload --use-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy federation-discovery Edge Function
        run: supabase functions deploy federation-discovery --use-api --project-ref "$SUPABASE_PROJECT_REF"
