name: Apply Profile Upgrade
on:
  push:
    paths:
      - 'ci/profile-upgrade.trigger'
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: python scripts/upgrade_profiles.py
      - run: |
          grep -q "ProfileEnhancements" src/pages/ProfilePage.tsx
          grep -q "pronouns" src/components/features/ProductionEditProfileDialog.tsx
          grep -q "featured_link" src/components/features/ProductionEditProfileDialog.tsx
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ProfilePage.tsx src/components/features/ProductionEditProfileDialog.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'feat: upgrade profile features'
          git push
      - run: rm -f scripts/upgrade_profiles.py .github/workflows/apply-profile-upgrade.yml ci/profile-upgrade.trigger
      - run: |
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove profile upgrade patcher'
          git push
