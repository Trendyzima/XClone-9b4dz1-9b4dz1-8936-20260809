name: Testagram Fediverse Delivery Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/federation-maintenance/**'
      - '.github/workflows/fediverse-maintenance.yml'

permissions:
  contents: read

concurrency:
  group: testagram-fediverse-maintenance
  cancel-in-progress: true

env:
  PROJECT_REF: aepbqfrmheihfsauzcby
  FUNCTION_URL: https://aepbqfrmheihfsauzcby.supabase.co/functions/v1/federation-maintenance

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate maintenance credential
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: test -n "$SUPABASE_SECRET_KEY"
      - name: Drain due federation deliveries
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body --max-time 45 \
            -X POST "$FUNCTION_URL" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -H "x-federation-internal: $SUPABASE_SECRET_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"limit":20}' | tee "$RUNNER_TEMP/federation-maintenance.json"
