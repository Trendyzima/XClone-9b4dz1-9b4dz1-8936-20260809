name: Fediverse Interaction Surgical V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fediverse-interaction-surgical-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch and verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/pages/FediversePage.tsx')
          s = p.read_text()
          pattern = re.compile(r"  const handleFedLike = async \(post: any\) => \{.*?\n  const handleFollow = async \(account: any\) => \{", re.S)
          replacement = '''  const handleFedLike = async (post: any) => {
    if (!user) { navigate('/auth'); return; }
    const key = post.object_url ?? post.uri ?? post.url ?? post.id;
    if (!key) return;
    const wasLiked = !!postStates[key]?.liked;
    setPostStates(prev => ({ ...prev, [key]: { ...prev[key], liked: !wasLiked, sending: true } }));
    try {
      if (wasLiked) await federation.unfavorite(key);
      else await federation.favorite(key);
      toast.success(wasLiked ? 'Like removed' : 'Liked on the Fediverse');
    } catch (err: any) {
      setPostStates(prev => ({ ...prev, [key]: { ...prev[key], liked: wasLiked } }));
      toast.error(`Like failed: ${err?.message ?? 'Federation request failed'}`);
    } finally {
      setPostStates(prev => ({ ...prev, [key]: { ...prev[key], sending: false } }));
    }
  };

  const handleFedBoost = async (post: any) => {
    if (!user) { navigate('/auth'); return; }
    const key = post.object_url ?? post.uri ?? post.url ?? post.id;
    if (!key) return;
    const wasBoosted = !!postStates[key]?.boosted;
    setPostStates(prev => ({ ...prev, [key]: { ...prev[key], boosted: !wasBoosted, sending: true } }));
    try {
      if (wasBoosted) await federation.unboost(key);
      else await federation.boost(key);
      toast.success(wasBoosted ? 'Repost removed' : 'Reposted on the Fediverse');
    } catch (err: any) {
      setPostStates(prev => ({ ...prev, [key]: { ...prev[key], boosted: wasBoosted } }));
      toast.error(`Repost failed: ${err?.message ?? 'Federation request failed'}`);
    } finally {
      setPostStates(prev => ({ ...prev, [key]: { ...prev[key], sending: false } }));
    }
  };

  const handleFedReply = async (post: any) => {
    if (!user) { navigate('/auth'); return; }
    const key = post.object_url ?? post.uri ?? post.url ?? post.id;
    if (!key) return;
    const text = postStates[key]?.replyText?.trim();
    if (!text) return;
    setPostStates(prev => ({ ...prev, [key]: { ...prev[key], sending: true } }));
    try {
      await federation.reply({ postId: key, content: text });
      toast.success('Reply sent to the Fediverse!');
      setPostStates(prev => ({ ...prev, [key]: { ...prev[key], replyText: '', replyOpen: false } }));
    } catch (err: any) {
      toast.error(`Reply failed: ${err?.message ?? 'Federation request failed'}`);
    } finally {
      setPostStates(prev => ({ ...prev, [key]: { ...prev[key], sending: false } }));
    }
  };

  const handleFollow = async (account: any) => {'''
          ns, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Expected interaction handlers not found; refusing to modify.')
          p.write_text(ns)
          assert 'await federation.favorite(key)' in ns
          assert 'await federation.boost(key)' in ns
          assert 'await federation.reply({ postId: key, content: text })' in ns
          assert 'functions/v1/activitypub-federation' not in ns
          PY
      - name: Typecheck
        run: |
          npm ci
          npm run typecheck
      - name: Commit target and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/FediversePage.tsx
          git rm .github/workflows/fediverse-interaction-surgical-v2.yml
          git diff --cached --check
          git commit -m 'fix: wire fediverse interactions through canonical federation client'
          git push origin main
