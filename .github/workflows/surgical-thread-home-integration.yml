name: Surgical thread home integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Patch Home unified thread adapter
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/HomePage.tsx')
          s = p.read_text()
          old = """      return result.posts.map((post: any) => ({\n        type: post.origin === 'federated' ? 'fedpost' as const : 'post' as const,\n        data: post.origin === 'federated' ? post : { ...post, user_profiles: post.user_profiles ?? post.author },\n      }));"""
          new = """      return result.posts.map((post: any) => ({\n        type: post.origin === 'federated'\n          ? 'fedpost' as const\n          : post.content_type === 'thread' || post.source === 'thread'\n            ? 'thread' as const\n            : 'post' as const,\n        data: post.origin === 'federated' ? post : { ...post, user_profiles: post.user_profiles ?? post.author },\n      }));"""
          if old not in s:
              raise SystemExit('unified feed adapter target not found')
          s = s.replace(old, new, 1)

          old = """      let threadsQuery = supabase\n        .from('threads')\n        .select('*, user_profiles:profiles!posts_author_id_fkey(*)')"""
          new = """      let threadsQuery = supabase\n        .from('threads')\n        .select('*, user_profiles(id, username, avatar_url, verified)')"""
          if old not in s:
              raise SystemExit('thread query target not found')
          s = s.replace(old, new, 1)

          old = """      const lastPost = items.filter((i: any) => i.type === 'post').slice(-1)[0];\n      if (lastPost) setFeedCursor((lastPost.data as any).created_at ?? null);\n      setFeedHasMore(items.filter((i: any) => i.type === 'post').length >= PAGE_SIZE);"""
          new = """      const lastContent = items.filter((i: any) => i.type === 'post' || i.type === 'thread').slice(-1)[0];\n      if (lastContent) setFeedCursor((lastContent.data as any).created_at ?? null);\n      setFeedHasMore(items.filter((i: any) => i.type === 'post' || i.type === 'thread').length >= PAGE_SIZE);"""
          if old not in s:
              raise SystemExit('home cursor target not found')
          s = s.replace(old, new, 1)

          old = """    const newPosts = newItems.filter((i: any) => i.type === 'post');\n    if (newPosts.length > 0) {\n      setFeedItems(prev => {\n        // Deduplicate by post id\n        const existingIds = new Set(prev.filter((i: any) => i.type === 'post').map((i: any) => (i.data as any).id));\n        const deduped = newItems.filter((i: any) => i.type !== 'post' || !existingIds.has((i.data as any).id));\n        return [...prev, ...deduped];\n      });\n      setPage(nextPage);\n      const lastPost = newPosts.slice(-1)[0];\n      if (lastPost) setFeedCursor((lastPost.data as any).created_at ?? null);\n      const hasMore = newPosts.length >= PAGE_SIZE;"""
          new = """    const newContent = newItems.filter((i: any) => i.type === 'post' || i.type === 'thread');\n    if (newContent.length > 0) {\n      setFeedItems(prev => {\n        const existingIds = new Set(prev.filter((i: any) => i.type === 'post' || i.type === 'thread').map((i: any) => `${i.type}:${(i.data as any).id}`));\n        const deduped = newItems.filter((i: any) => (i.type !== 'post' && i.type !== 'thread') || !existingIds.has(`${i.type}:${(i.data as any).id}`));\n        return [...prev, ...deduped];\n      });\n      setPage(nextPage);\n      const lastContent = newContent.slice(-1)[0];\n      if (lastContent) setFeedCursor((lastContent.data as any).created_at ?? null);\n      const hasMore = newContent.length >= PAGE_SIZE;"""
          if old not in s:
              raise SystemExit('pagination target not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
      - name: Typecheck and build
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck --if-present
          npm run build
      - name: Commit surgical patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/HomePage.tsx
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: surface threads in unified home feed'
          git push origin HEAD:main
      - name: Remove temporary patch workflow
        if: success()
        run: |
          set -euo pipefail
          git rm .github/workflows/surgical-thread-home-integration.yml
          git commit -m 'chore: remove temporary thread home patch workflow'
          git push origin HEAD:main
