name: Testagram Supabase Production Migrations

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Immutable release commit to migrate and verify'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-production-migrate.yml'

permissions:
  contents: read

concurrency:
  group: testagram-supabase-production-migrations-${{ inputs.release_sha || github.sha }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: aepbqfrmheihfsauzcby
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_POOLER_HOST: aws-0-eu-central-1.pooler.supabase.com
  RELEASE_SHA: ${{ inputs.release_sha || github.sha }}

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 1

      - name: Verify migration release identity
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$RELEASE_SHA"
          echo "Migration release commit=$actual"

      - name: Install Supabase CLI
        run: |
          set -euo pipefail
          CLI_VERSION="$(curl -fsSL https://api.github.com/repos/supabase/cli/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          curl -fsSL "https://github.com/supabase/cli/releases/download/${CLI_VERSION}/supabase_linux_amd64.tar.gz" -o /tmp/supabase.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /tmp
          install -m 0755 /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Validate migration credentials
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD.'; exit 1; }
          python3 - <<'PY'
          import os
          from urllib.parse import quote
          password = os.environ['SUPABASE_DB_PASSWORD']
          print('Supabase database password is present; length:', len(password))
          print('RFC3986 encoding check:', quote(password, safe='') != password or 'plain-safe')
          PY

      - name: Build production session-pooler database URL
        run: |
          set -euo pipefail
          encoded_password="$(python3 -c 'import os; from urllib.parse import quote; print(quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          echo "SUPABASE_DB_URL=postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded_password}@${SUPABASE_POOLER_HOST}:5432/postgres" >> "$GITHUB_ENV"
          echo 'Supabase session-pooler database URL prepared without exposing the password.'

      - name: Verify production database connectivity
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Verify migration workspace is clean
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- supabase/migrations)"
          echo 'Checked-out migration files are the pending source of truth; remote synchronization will not overwrite them.'

      - name: Reject duplicate migration version sources
        run: |
          set -euo pipefail
          versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]{8,14})_.*/\1/' | sort)"
          duplicates="$(printf '%s\n' "$versions" | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo 'Duplicate Supabase migration version prefixes detected. Each version must have exactly one local source file.'
            while IFS= read -r version; do
              [ -n "$version" ] || continue
              echo "Version $version:"
              find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" -print | sort
            done <<< "$duplicates"
            exit 1
          fi
          echo 'Migration version prefixes are unique.'

      - name: Reconcile remote-only migration history only when source is absent
        run: |
          set -euo pipefail
          history="$(supabase migration list --db-url "$SUPABASE_DB_URL")"
          for version in \
            20260909202200 \
            20260909202315 \
            20260909202538 \
            20260909212257 \
            20260909215557 \
            20260910090706 \
            20260910090950; do
            if find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" -print -quit | grep -q .; then
              echo "Local migration source exists for $version; preserving remote history."
            elif printf '%s\n' "$history" | grep -q "$version"; then
              echo "Remote-only migration $version has no recoverable local source; repairing history as reverted."
              supabase migration repair "$version" --status reverted --db-url "$SUPABASE_DB_URL"
            else
              echo "Migration $version is absent from both local source and remote history."
            fi
          done

      - name: Verify reconciled production migration history
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Preview pending production migrations
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --include-all

      - name: Apply pending production migrations
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all

      - name: Verify production migration history
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL"
          echo 'Production migration gate completed.'
