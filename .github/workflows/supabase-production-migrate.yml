name: Testagram Supabase Production Migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: testagram-supabase-production-migrations-${{ github.sha }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: aepbqfrmheihfsauzcby
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v5

      - name: Validate migration credentials
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN.'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD.'; exit 1; }
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) echo 'Supabase Management API token format detected.' ;;
            *) echo 'SUPABASE_ACCESS_TOKEN is not a Supabase personal access token (expected sbp_*).'; exit 1 ;;
          esac

      - name: Verify Supabase Management API access
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/supabase-project.json"
          status_code="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")"
          case "$status_code" in
            200) echo 'Supabase Management API authorization verified for the canonical project.' ;;
            401) echo 'Supabase Management API rejected SUPABASE_ACCESS_TOKEN (401). Replace it with a valid PAT.'; exit 1 ;;
            403) echo 'Supabase Management API denied this token for the canonical project (403).'; exit 1 ;;
            *)
              echo "Supabase Management API preflight failed with HTTP $status_code."
              sed -E 's/"(access_token|token|password|secret|api_key)"[[:space:]]*:[[:space:]]*"[^"]*"/"\1":"***"/g' "$response_file" | head -c 2000
              echo
              exit 1
              ;;
          esac

      - name: Install Supabase CLI
        run: npm install --global supabase@latest

      - name: Link target production project
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify migration workspace is clean
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- supabase/migrations)"
          echo 'Checked-out migration files are the pending source of truth; remote synchronization will not overwrite them.'

      - name: Reject duplicate migration version sources
        run: |
          set -euo pipefail
          versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]{8,14})_.*/\1/' | sort)"
          duplicates="$(printf '%s\n' "$versions" | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo 'Duplicate Supabase migration version prefixes detected. Each version must have exactly one local source file.'
            while IFS= read -r version; do
              [ -n "$version" ] || continue
              echo "Version $version:"
              find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" -print | sort
            done <<< "$duplicates"
            exit 1
          fi
          echo 'Migration version prefixes are unique.'

      - name: Inspect production migration history
        run: |
          set -euo pipefail
          supabase migration list --linked

      - name: Reconcile remote-only migration history only when source is absent
        run: |
          set -euo pipefail
          history="$(supabase migration list --linked)"
          # Repair history only when a remote version has no local source file.
          # Never revert a version whose original migration is present locally.
          for version in \
            20260909202200 \
            20260909202315 \
            20260909202538 \
            20260909212257 \
            20260909215557; do
            if find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" -print -quit | grep -q .; then
              echo "Local migration source exists for $version; preserving remote history."
            elif printf '%s\n' "$history" | grep -q "$version"; then
              echo "Remote-only migration $version has no recoverable local source; repairing history as reverted."
              supabase migration repair "$version" --status reverted
            else
              echo "Migration $version is absent from both local source and remote history."
            fi
          done

      - name: Verify reconciled production migration history
        run: |
          set -euo pipefail
          supabase migration list --linked

      - name: Preview pending production migrations
        run: |
          set -euo pipefail
          supabase db push --dry-run --include-all

      - name: Apply pending production migrations
        run: |
          set -euo pipefail
          supabase db push --include-all

      - name: Verify production migration history
        run: |
          set -euo pipefail
          supabase migration list --linked
          echo 'Production migration gate completed.'
