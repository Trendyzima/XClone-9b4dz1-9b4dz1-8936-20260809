name: Testagram Supabase Production Migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    environment: production
    env:
      # Canonical production Supabase project for Testagram.
      SUPABASE_PROJECT_REF: aepbqfrmheihfsauzcby
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Validate migration credentials
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN.'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD.'; exit 1; }

          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) echo 'Supabase Management API token format detected.' ;;
            *) echo 'SUPABASE_ACCESS_TOKEN is not a Supabase personal access token (expected sbp_*).'; exit 1 ;;
          esac

      - name: Verify Supabase Management API access
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/supabase-project.json"
          status_code="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")"

          case "$status_code" in
            200)
              echo 'Supabase Management API authorization verified for the canonical project.'
              ;;
            401)
              echo 'Supabase Management API rejected SUPABASE_ACCESS_TOKEN (401). Replace it with a valid PAT.'
              exit 1
              ;;
            403)
              echo 'Supabase Management API denied this token for the canonical project (403). The token owner must have project/org access and the token must include the required project permissions.'
              exit 1
              ;;
            *)
              echo "Supabase Management API preflight failed with HTTP $status_code."
              sed -E 's/"(access_token|token|password|secret|api_key)"[[:space:]]*:[[:space:]]*"[^"]*"/"\1":"***"/g' "$response_file" | head -c 2000
              echo
              exit 1
              ;;
          esac

      - name: Install Supabase CLI
        run: npm install --global supabase@latest

      - name: Link target production project
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending production migrations
        run: |
          set -euo pipefail
          supabase db push --dry-run

      - name: Apply pending production migrations
        run: |
          set -euo pipefail
          supabase db push

      - name: Verify migration history
        run: |
          set -euo pipefail
          supabase migration list --linked
          echo 'Production migration gate completed.'
