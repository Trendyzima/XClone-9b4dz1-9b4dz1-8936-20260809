name: One-time repair home feed relations

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-home-feed]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair PostgREST profile relation in HomePage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/HomePage.tsx')
          s = p.read_text()
          replacements = {
            ".select('*, user_profiles(*)')": ".select('*, user_profiles:profiles!posts_author_id_fkey(*)')",
            ".select('id, content, image_url, video_url, is_video, views_count, likes_count, user_profiles(id, username, avatar_url, verified)')": ".select('id, content, image_url, video_url, is_video, views_count, likes_count, user_profiles:profiles!posts_author_id_fkey(id, username, avatar_url, verified)')",
          }
          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed = True
          if not changed:
              raise SystemExit('No HomePage relation patterns matched; refusing a no-op repair.')
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/HomePage.tsx
          git commit -m 'fix homepage post profile relation'
          git push
      - name: Remove one-time repair workflow
        run: |
          git rm .github/workflows/repair-home-feed-relations.yml
          git commit -m 'remove one-time home feed repair workflow'
          git push
