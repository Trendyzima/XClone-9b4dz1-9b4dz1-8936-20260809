name: Testagram Vercel Serverless CI

on:
  push:
    branches: [main, feat/vercel-serverless-federation]
    paths:
      - 'api/**'
      - 'vercel.json'
      - 'package.json'
      - '.github/workflows/vercel-serverless-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'vercel.json'
      - 'package.json'
      - '.github/workflows/vercel-serverless-ci.yml'

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Ensure application router dependency is materialized
        run: npm install react-router-dom@6.30.1 --no-save
      - name: Typecheck application and serverless functions
        run: npm run typecheck
      - name: Build Vite application
        run: npm run build
      - name: Validate Vercel configuration
        run: node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('vercel.json','utf8')); if(!v.functions?.['api/**/*.ts']) throw new Error('Vercel serverless function runtime is not configured'); if(v.functions['api/**/*.ts'].runtime!=='nodejs22.x') throw new Error('Unexpected Vercel runtime'); console.log('Vercel serverless configuration valid')"
