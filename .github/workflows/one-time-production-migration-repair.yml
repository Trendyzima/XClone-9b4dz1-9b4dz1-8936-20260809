name: One-time Production Migration Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_REF: zcjtvykwwplnzyyslnop
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate migration credentials
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Normalize PostgreSQL function defaults
        run: |
          set -euo pipefail
          migration='supabase/migrations/20260907130000_profiles_communities_spaces_production.sql'
          test -f "$migration"
          # PostgreSQL does not allow a subquery in a function parameter DEFAULT.
          # auth.uid() is already a stable SQL function, so use it directly.
          sed -i 's/default (select auth\.uid())/default auth.uid()/g' "$migration"
          if grep -nF 'default (select auth.uid())' "$migration"; then
            echo 'Invalid auth.uid() subquery default remains.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- "$migration"; then
            git add "$migration"
            git commit -m 'fix(db): use valid auth uid defaults in community helpers'
            git push origin HEAD:main
          fi
      - name: Install Supabase CLI
        run: npm install --global supabase@latest
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Preview repaired migration chain including out-of-order local history
        run: supabase db push --dry-run --include-all
      - name: Apply repaired migration chain including out-of-order local history
        run: supabase db push --include-all
      - name: Verify production migration history
        run: supabase migration list --linked
      - name: Remove one-time repair workflow
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-production-migration-repair.yml
          git commit -m 'chore(ci): remove completed one-time migration repair'
          git push origin HEAD:main
