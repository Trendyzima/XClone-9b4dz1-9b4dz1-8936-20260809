name: PayPal Wallet E2E

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/worker/paypal.ts'
      - 'cloudflare/worker/production-entrypoint.ts'
      - 'cloudflare/wrangler.jsonc'
      - 'supabase/migrations/**'
      - '.github/workflows/paypal-wallet-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: '4.126.0'
  SUPABASE_URL: 'https://zcjtvykwwplnzyyslnop.supabase.co'
  WORKER_URL: 'https://testagram-api.nahashonnyaga794.workers.dev'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate PayPal source wiring
        run: |
          set -euo pipefail
          test -s cloudflare/worker/paypal.ts
          test -s cloudflare/worker/production-entrypoint.ts
          grep -Fq 'handlePayPal' cloudflare/worker/production-entrypoint.ts
          grep -Fq 'finalize_paypal_topup' cloudflare/worker/paypal.ts
          grep -Fq 'zcjtvykwwplnzyyslnop.supabase.co' cloudflare/wrangler.jsonc
      - name: Build Worker without secret material
        run: |
          set -euo pipefail
          rm -rf /tmp/paypal-worker-build
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config cloudflare/wrangler.jsonc --dry-run --outdir /tmp/paypal-worker-build
          bundle="$(find /tmp/paypal-worker-build -type f -name '*.js' -print -quit)"
          test -n "$bundle"
          test -s "$bundle"
          grep -Fq '/api/paypal' "$bundle"
          grep -Fq 'finalize_paypal_topup' "$bundle"

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy PayPal-enabled Worker while preserving existing Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config cloudflare/wrangler.jsonc
      - name: Verify deployed PayPal configuration
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/paypal-config.json -w '%{http_code}' --max-time 20 "$WORKER_URL/api/paypal/config")
          cat /tmp/paypal-config.json
          test "$status" = 200
          jq -e '.ok == true and .provider == "paypal" and .environment == "sandbox" and .configured == true' /tmp/paypal-config.json >/dev/null
