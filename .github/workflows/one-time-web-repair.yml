name: One-time web source repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[web-quality-repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Repair known web type/build regressions
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              text = p.read_text()
              new = fn(text)
              if new == text:
                  print(f'no change: {path}')
              else:
                  p.write_text(new)
                  print(f'updated: {path}')

          # TopBar is used by several pages without a page-specific title.
          edit('src/components/layout/TopBar.tsx', lambda s: s.replace(
              'interface TopBarProps { title: string;',
              'interface TopBarProps { title?: string;'
          ).replace(
              '<h1 className="text-xl font-bold">{title}</h1>',
              '<h1 className="text-xl font-bold">{title ?? ""}</h1>'
          ))

          # A previous automated repair truncated TeamChatPage after its icon import.
          team_chat = '''import { useState } from 'react';
          import { Send, MessageSquare, Users } from 'lucide-react';
          import { TopBar } from '@/components/layout/TopBar';
          import { useAuth } from '@/hooks/useAuth';

          interface TeamMessage { id: string; text: string; username: string; createdAt: number; }

          export default function TeamChatPage() {
            const { user } = useAuth();
            const [input, setInput] = useState('');
            const [messages, setMessages] = useState<TeamMessage[]>([
              { id: 'welcome', text: 'Welcome to Team Chat. Keep team conversations focused and respectful.', username: 'Testagram', createdAt: Date.now() },
            ]);

            const sendMessage = () => {
              const text = input.trim();
              if (!text) return;
              setMessages((current) => [...current, {
                id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
                text,
                username: user?.username ?? 'You',
                createdAt: Date.now(),
              }]);
              setInput('');
            };

            return (
              <div className="min-h-screen bg-background">
                <TopBar title="Team Chat" showBack />
                <main className="mx-auto flex max-w-3xl flex-col px-4 py-6">
                  <div className="mb-4 rounded-2xl border border-border bg-card p-4">
                    <div className="flex items-center gap-3">
                      <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-primary/10 text-primary"><MessageSquare className="h-5 w-5" /></div>
                      <div><h2 className="font-bold">Team Chat</h2><p className="text-xs text-muted-foreground">Private workspace conversation</p></div>
                      <Users className="ml-auto h-5 w-5 text-muted-foreground" />
                    </div>
                  </div>
                  <div className="min-h-[55vh] space-y-3 rounded-2xl border border-border bg-card p-4">
                    {messages.map((message) => (
                      <div key={message.id} className="rounded-xl bg-muted/50 p-3">
                        <div className="mb-1 flex items-center justify-between gap-2"><span className="text-sm font-semibold">{message.username}</span><span className="text-[10px] text-muted-foreground">{new Date(message.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></div>
                        <p className="whitespace-pre-wrap break-words text-sm">{message.text}</p>
                      </div>
                    ))}
                  </div>
                  <div className="mt-4 flex gap-2">
                    <input value={input} onChange={(event) => setInput(event.target.value)} onKeyDown={(event) => { if (event.key === 'Enter') sendMessage(); }} placeholder="Write a message…" className="min-w-0 flex-1 rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary/30" />
                    <button type="button" onClick={sendMessage} aria-label="Send message" className="rounded-xl bg-primary px-4 text-primary-foreground"><Send className="h-5 w-5" /></button>
                  </div>
                </main>
              </div>
            );
          }
          '''
          if Path('src/pages/TeamChatPage.tsx').read_text().count('\n') < 30:
              Path('src/pages/TeamChatPage.tsx').write_text(team_chat)
              print('replaced truncated TeamChatPage.tsx')

          # Community leaderboard data must be typed before Object.values/sort.
          edit('src/pages/CommunityPage.tsx', lambda s: s
              .replace('const agg: any = {};', 'const agg: Record<string, { profile: any; likes: number; posts: number }> = {};')
              .replace("m.user_profiles?.id ?? m.user_id ?? ''", "m.user_id ?? ''")
          )

          # The SEO hook supports only the standard OG types; video posts still use article metadata.
          edit('src/pages/PostThreadPage.tsx', lambda s: s.replace(
              "type: post?.is_video ? 'video.other' : 'article',",
              "type: 'article',"
          ))

          # PollCard can be rendered from older reply records that only carry postId.
          def repair_poll(s):
              s = s.replace('  poll: Poll;\n', '  poll?: Poll;\n')
              s = s.replace(
                  '  const [pollData, setPollData] = useState(poll);',
                  "  const activePoll: Poll = poll ?? { id: postId, question: '', expires_at: new Date(0).toISOString(), total_votes: 0, options: [] };\n  const [pollData, setPollData] = useState(activePoll);"
              )
              s = s.replace('useEffect(() => { if (user) checkIfVoted(); }, [poll.id, user?.id]);', 'useEffect(() => { if (user && poll) checkIfVoted(); }, [poll?.id, user?.id]);')
              s = s.replace('    if (!user) return;\n    const { data }', '    if (!user || !poll) return;\n    const { data }', 1)
              s = s.replace('.eq(\'poll_id\', poll.id)', ".eq('poll_id', activePoll.id)")
              s = s.replace("if (!user) { navigate('/auth'); return; }", "if (!user || !poll) { navigate('/auth'); return; }")
              s = s.replace('new Date(poll.expires_at)', 'new Date(activePoll.expires_at)')
              s = s.replace('poll.id', 'activePoll.id')
              s = s.replace('poll.expires_at', 'activePoll.expires_at')
              s = s.replace('  return (\n    <div className="mt-3', '  if (!poll) return null;\n\n  return (\n    <div className="mt-3')
              return s
          edit('src/components/features/PollCard.tsx', repair_poll)

          # SEO audit status scoring requires the complete RouteAudit shape.
          edit('src/pages/SEOAuditPage.tsx', lambda s: s.replace(
              '      status: scoreRoute(r),',
              '      status: scoreRoute({ ...r, title: null, description: null, ogImage: null, canonical: null }),'
          ))

          # Notification preview constants are intentionally string literals; narrow them at the call boundary.
          edit('src/pages/SettingsPage.tsx', lambda s: s
              .replace("import { useNotificationSound } from '@/hooks/useNotificationSound';", "import { useNotificationSound, type SoundType } from '@/hooks/useNotificationSound';")
              .replace('onClick={() => playSound(type)}', 'onClick={() => playSound(type as SoundType)}')
          )

          # Newer TypeScript versions type Object.entries/values as unknown for loosely shaped maps.
          # Keep the wallet calculations strongly typed at each boundary instead of weakening tsconfig globally.
          def repair_wallet(s):
              s = s.replace(
                  "Object.entries(dailyMap).map(([date, v]) => ({ date, In: parseFloat(v.in.toFixed(2)), Out: parseFloat(v.out.toFixed(2)) }))",
                  "(Object.entries(dailyMap) as [string, { in: number; out: number }][]).map(([date, v]) => ({ date, In: parseFloat(v.in.toFixed(2)), Out: parseFloat(v.out.toFixed(2)) }))"
              )
              s = s.replace(
                  "const arr = Object.entries(map).map(([date, v]) => ({ date, ...v }));",
                  "const arr = (Object.entries(map) as [string, { count: number; amount: number; hasIn: boolean }][]).map(([date, v]) => ({ date, ...v }));"
              )
              s = s.replace(
                  "const chartData = Object.entries(dayMap).map(([date, bal]) => {",
                  "const chartData = (Object.entries(dayMap) as [string, number][]).map(([date, bal]) => {"
              )
              s = s.replace(
                  "Math.max(...Object.values(dayMap).map(v => v.inAmt + v.outAmt), 1)",
                  "Math.max(...(Object.values(dayMap) as { inAmt: number; outAmt: number }[]).map(v => v.inAmt + v.outAmt), 1)"
              )
              s = s.replace(
                  "const top10 = Object.entries(counts).sort((a: any, b: any) => b[1] - a[1]).slice(0, 10);",
                  "const top10 = (Object.entries(counts) as [string, number][]).sort((a, b) => b[1] - a[1]).slice(0, 10);"
              )
              return s
          edit('src/pages/WalletPage.tsx', repair_wallet)

          # Ensure the repair itself is complete before committing.
          required = [
              'src/components/layout/TopBar.tsx',
              'src/pages/TeamChatPage.tsx',
              'src/pages/CommunityPage.tsx',
              'src/pages/PostThreadPage.tsx',
              'src/components/features/PollCard.tsx',
              'src/pages/SEOAuditPage.tsx',
              'src/pages/SettingsPage.tsx',
              'src/pages/WalletPage.tsx',
          ]
          for path in required:
              if not Path(path).exists():
                  raise SystemExit(f'missing repaired source: {path}')

      - name: Remove one-time repair workflow and commit source repairs
        run: |
          rm -f .github/workflows/one-time-web-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/one-time-web-repair.yml
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "fix(web): repair typecheck and build regressions [web-quality-repair]"
          git push
