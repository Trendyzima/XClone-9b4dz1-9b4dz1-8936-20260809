name: Patch Fediverse remote interactions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-fediverse-interactions.yml'
      - 'cloudflare/worker/federation-entrypoint.ts'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch ActivityPub inbox handlers
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('cloudflare/worker/federation-entrypoint.ts')
          s = p.read_text()
          marker = "    await markInbound(e, activityId, 'processed');\n    return ap({ ok: true, received: true, relationshipMatched: true }, 202);\n    }\n\n    await markInbound(e, activityId, 'processed');"
          if marker not in s:
              raise SystemExit('expected federation inbox insertion point not found')
          block = r'''    // Persist remote status objects so Testagram can render and interact with them locally.
    if (activity.type === 'Create') {
      const object = activity.object && typeof activity.object === 'object' ? activity.object : null;
      const objectUrl = typeof object?.id === 'string' ? object.id : (typeof activity.object === 'string' ? activity.object : '');
      if (!objectUrl) { await markInbound(e, activityId, 'rejected', 'Create object id required'); return ap({ error: 'Create object id required' }, 400); }
      const attributed = typeof object?.attributedTo === 'string' ? object.attributedTo : (object?.attributedTo?.id || remoteActorUri);
      await db(e, 'federation_objects?on_conflict=object_url', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ object_url: objectUrl, actor_url: attributed, object_type: object?.type || 'Object', object: object || { id: objectUrl }, published_at: object?.published ? new Date(object.published).toISOString() : null, fetched_at: new Date().toISOString(), updated_at: new Date().toISOString() }) });
      await markInbound(e, activityId, 'processed');
      return ap({ ok: true, received: true, storedObject: objectUrl }, 202);
    }
    if (activity.type === 'Like' || activity.type === 'Announce') {
      const objectUrl = typeof activity.object === 'string' ? activity.object : activity.object?.id;
      if (!objectUrl) { await markInbound(e, activityId, 'rejected', `${activity.type} object id required`); return ap({ error: `${activity.type} object id required` }, 400); }
      await db(e, 'federation_remote_engagements', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ activity_uri: activityId, object_url: objectUrl, remote_actor_url: remoteActorUri, interaction_type: activity.type === 'Like' ? 'like' : 'repost', payload: activity, status: 'active', received_at: new Date().toISOString(), updated_at: new Date().toISOString(), expires_at: new Date(Date.now() + 30 * 86400000).toISOString() }) });
      await markInbound(e, activityId, 'processed');
      return ap({ ok: true, received: true, engagementStored: true }, 202);
    }
    if (activity.type === 'Undo') {
      const targetActivity = typeof activity.object === 'string' ? activity.object : activity.object?.id;
      if (targetActivity) await db(e, `federation_remote_engagements?activity_uri=eq.${enc(targetActivity)}`, { method: 'PATCH', body: JSON.stringify({ status: 'undone', updated_at: new Date().toISOString() }) });
      await markInbound(e, activityId, 'processed');
      return ap({ ok: true, received: true, undone: Boolean(targetActivity) }, 202);
    }

'''
          s = s.replace(marker, marker.replace("    await markInbound(e, activityId, 'processed');\n    return ap({ ok: true, received: true, relationshipMatched: true }, 202);\n    }\n\n", "    await markInbound(e, activityId, 'processed');\n    return ap({ ok: true, received: true, relationshipMatched: true }, 202);\n    }\n\n") + block, 1)
          p.write_text(s)
          PY
      - name: Commit and remove one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-fediverse-interactions.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare/worker/federation-entrypoint.ts .github/workflows/patch-fediverse-interactions.yml
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m 'Add remote Fediverse content and engagement handling'
          git push origin HEAD:main
