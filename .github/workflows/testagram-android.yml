name: Testagram Android

on:
  push:
    branches: [main, testagram-native-shell]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Build canonical web application
        run: npm run build

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical Testagram surface and repository parity
        run: python3 tools/verify_testagram.py

  android:
    needs: [web, parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x android/gradlew
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: testagram-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
