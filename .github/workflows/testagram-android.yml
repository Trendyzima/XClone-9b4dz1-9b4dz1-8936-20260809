name: Testagram Android

on:
  push:
    branches: [main, testagram-native-shell]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install web dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build canonical web application
        run: npm run build

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify canonical Testagram surface and repository parity
        run: python3 tools/verify_testagram.py

  android:
    needs: [web, parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Restore Gradle wrapper executable permission
        run: chmod +x android/gradlew
      - name: Verify native Android project has no Capacitor wiring
        run: |
          ! grep -RniE 'capacitor|BridgeActivity|cordova' android/app android/settings.gradle android/build.gradle
      - name: Assemble native debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: testagram-native-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
