name: Apply community and spaces upgrade wiring

on:
  push:
    paths:
      - '.github/workflows/apply-community-spaces-upgrades.yml'
      - 'src/components/features/CommunitySpacesUpgrades.tsx'

permissions:
  contents: write

jobs:
  wire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.tsx
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          import_line = "import { CommunitySpacesUpgrades } from '@/components/features/CommunitySpacesUpgrades';"
          anchor = "import { LiveNotificationBanner } from '@/components/features/LiveNotificationBanner';"
          if import_line not in s:
              if anchor not in s:
                  raise SystemExit('LiveNotificationBanner import anchor not found')
              s = s.replace(anchor, anchor + "\n" + import_line, 1)
          render_anchor = "<LiveNotificationBanner />"
          if "<CommunitySpacesUpgrades />" not in s:
              if render_anchor not in s:
                  raise SystemExit('LiveNotificationBanner render anchor not found')
              s = s.replace(render_anchor, render_anchor + "\n        <CommunitySpacesUpgrades />", 1)
          p.write_text(s)
          PY
      - name: Commit wiring and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-community-spaces-upgrades.yml
          git add src/App.tsx .github/workflows/apply-community-spaces-upgrades.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat: wire community and spaces upgrade hub'
          git push
