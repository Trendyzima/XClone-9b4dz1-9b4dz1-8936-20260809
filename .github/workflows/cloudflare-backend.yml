name: Testagram Cloudflare Backend

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'supabase/migrations/**'
      - '.github/workflows/cloudflare-backend.yml'
      - '.env'
      - '.env.example'
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'supabase/migrations/**'
      - '.github/workflows/cloudflare-backend.yml'
      - '.env'
      - '.env.example'

permissions:
  contents: read

env:
  WRANGLER_VERSION: '4.126.0'
  MEDIA_BUCKET: 'testagram-media'
  SUPABASE_PROJECT_REF: 'zcjtvykwwplnzyyslnop'
  SUPABASE_URL: 'https://zcjtvykwwplnzyyslnop.supabase.co'
  SUPABASE_JWKS_URL: 'https://zcjtvykwwplnzyyslnop.supabase.co/auth/v1/.well-known/jwks.json'
  WORKER_HEALTH_URL: 'https://testagram-api.nahashonnyaga794.workers.dev/api/health'
  PRODUCTION_HEALTH_URL: 'https://testagram.site/api/health'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate required Supabase deployment secrets
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing GitHub Actions secret: SUPABASE_PUBLISHABLE_KEY'; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo 'Missing GitHub Actions secret: SUPABASE_SECRET_KEY'; exit 1; }
      - name: Validate Cloudflare Worker configuration
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          {
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY"
          } > "$secrets_file"
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --config cloudflare/wrangler.jsonc --dry-run --secrets-file "$secrets_file"
      - name: Verify backend migrations are tracked
        run: |
          test -f supabase/migrations/20260906_backend_core.sql
          test -f supabase/migrations/20260906104613_harden_production_api_security.sql
          test -f supabase/migrations/20260906150000_media_assets_20mb_limit.sql
          test -f supabase/migrations/20260906160000_harden_media_visibility_and_function_security.sql
      - name: Verify Supabase project endpoint
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${SUPABASE_URL}/rest/v1/")"
          case "$status" in
            200|401|403) echo "Supabase endpoint reachable for project ${SUPABASE_PROJECT_REF} (HTTP ${status})" ;;
            *) echo "Supabase endpoint check failed: HTTP ${status}"; exit 1 ;;
          esac
      - name: Verify Supabase JWKS endpoint
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/jwks.json -w '%{http_code}' --max-time 15 "$SUPABASE_JWKS_URL")"
          test "$status" = "200"
          grep -Fq '"keys"' /tmp/jwks.json

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Ensure Cloudflare R2 media bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if ! npx --yes wrangler@${{ env.WRANGLER_VERSION }} r2 bucket list | grep -Fq "${MEDIA_BUCKET}"; then
            npx --yes wrangler@${{ env.WRANGLER_VERSION }} r2 bucket create "${MEDIA_BUCKET}"
          fi
      - name: Prepare production Worker entrypoint
        run: |
          set -euo pipefail
          cat > cloudflare/worker/production-entrypoint.ts <<'EOF'
          import worker from './index';

          interface Env {
            SUPABASE_URL: string;
            SUPABASE_PROJECT_REF: string;
            SUPABASE_ANON_KEY: string;
            SUPABASE_SECRET_KEY: string;
            SUPABASE_JWKS_URL: string;
            APP_ORIGIN: string;
            MEDIA: R2Bucket;
          }

          async function health(request: Request, env: Env): Promise<Response> {
            let databaseStatus = 0;
            let databaseReachable = false;
            let databaseError: string | undefined;
            try {
              const upstream = await fetch(`${env.SUPABASE_URL}/rest/v1/profiles?select=id&limit=1`, {
                headers: { apikey: env.SUPABASE_SECRET_KEY }
              });
              databaseStatus = upstream.status;
              databaseReachable = upstream.ok;
              if (!upstream.ok) databaseError = (await upstream.text()).slice(0, 300);
            } catch (error) {
              databaseError = error instanceof Error ? error.message : 'Supabase request failed';
            }

            let jwksReachable = false;
            try {
              const jwks = await fetch(env.SUPABASE_JWKS_URL, { headers: { Accept: 'application/json' } });
              jwksReachable = jwks.ok;
            } catch { /* health will report false */ }

            const r2Binding = Boolean(env.MEDIA);
            const ok = databaseReachable && jwksReachable && r2Binding;
            return new Response(JSON.stringify({
              ok,
              service: 'testagram-api',
              database: 'supabase',
              supabaseProjectRef: env.SUPABASE_PROJECT_REF,
              databaseReachable,
              databaseStatus,
              ...(databaseError ? { databaseError } : {}),
              jwksReachable,
              media: 'cloudflare-r2',
              r2Binding,
              maxMediaBytes: 20 * 1024 * 1024,
              edge: 'cloudflare'
            }), {
              status: ok ? 200 : 503,
              headers: {
                'Content-Type': 'application/json; charset=utf-8',
                'Cache-Control': 'no-store',
                'X-Content-Type-Options': 'nosniff',
                'Access-Control-Allow-Origin': env.APP_ORIGIN,
                'Vary': 'Origin'
              }
            });
          }

          export default {
            async fetch(request: Request, env: Env, ctx: ExecutionContext): Promise<Response> {
              if (new URL(request.url).pathname === '/api/health') return health(request, env);
              return worker.fetch(request, env, ctx);
            }
          };
          EOF
          # Keep the temporary Wrangler config beside the production entrypoint.
          # Wrangler resolves `main` relative to the config file, so placing the
          # temporary config under cloudflare/ avoids the /tmp path resolution bug.
          cp cloudflare/wrangler.jsonc cloudflare/.wrangler-production.jsonc
          python - <<'PY'
          from pathlib import Path
          p = Path('cloudflare/.wrangler-production.jsonc')
          text = p.read_text()
          text = text.replace('"main": "./worker/index.ts"', '"main": "./worker/production-entrypoint.ts"')
          p.write_text(text)
          PY
      - name: Deploy Testagram API to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -n "$SUPABASE_SECRET_KEY"
          test -f cloudflare/worker/production-entrypoint.ts
          test -f cloudflare/.wrangler-production.jsonc
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file" cloudflare/worker/production-entrypoint.ts cloudflare/.wrangler-production.jsonc' EXIT
          {
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY"
          } > "$secrets_file"
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy \
            --config cloudflare/.wrangler-production.jsonc \
            --secrets-file "$secrets_file"
      - name: Smoke test direct Cloudflare Worker and Supabase bridge
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/worker-health.json -w '%{http_code}' --max-time 20 "$WORKER_HEALTH_URL" || true)"
          echo "Worker health HTTP status: ${status}"
          cat /tmp/worker-health.json
          test "$status" = "200"
          grep -Fq '"ok":true' /tmp/worker-health.json
          grep -Fq '"databaseReachable":true' /tmp/worker-health.json
          grep -Fq '"jwksReachable":true' /tmp/worker-health.json
          grep -Fq '"media":"cloudflare-r2"' /tmp/worker-health.json
          grep -Fq "${SUPABASE_PROJECT_REF}" /tmp/worker-health.json
      - name: Diagnose production /api route
        continue-on-error: true
        run: |
          set -u
          status="$(curl -sS -o /tmp/production-health.txt -w '%{http_code}' --max-time 15 "$PRODUCTION_HEALTH_URL" || true)"
          echo "Production /api/health HTTP status: ${status}"
          cat /tmp/production-health.txt || true
          if [ "$status" = "200" ]; then
            echo 'Production custom-domain route is reaching the Worker.'
          else
            echo 'Production custom-domain route is not reaching the Worker yet.'
          fi
