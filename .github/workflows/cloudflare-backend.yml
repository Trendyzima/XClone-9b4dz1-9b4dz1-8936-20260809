name: Testagram Cloudflare Backend

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'supabase/migrations/**'
      - '.github/workflows/cloudflare-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'supabase/migrations/**'
      - '.github/workflows/cloudflare-backend.yml'

permissions:
  contents: read

env:
  WRANGLER_VERSION: '4.126.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate Cloudflare Worker configuration
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --config cloudflare/wrangler.jsonc --dry-run
      - name: Verify backend migrations are tracked
        run: |
          test -f supabase/migrations/20260906_backend_core.sql
          test -f supabase/migrations/20260906104613_harden_production_api_security.sql

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Deploy Testagram API to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --config cloudflare/wrangler.jsonc
