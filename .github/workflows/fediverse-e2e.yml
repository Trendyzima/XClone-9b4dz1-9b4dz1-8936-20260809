name: Testagram Fediverse Interoperability E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/gateway-relay/**'
      - 'supabase/migrations/**'
      - '.github/workflows/fediverse-e2e.yml'
      - 'src/api/federation.ts'

permissions:
  contents: read

jobs:
  fediverse-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://zcjtvykwwplnzyyslnop.supabase.co
      GATEWAY_URL: https://zcjtvykwwplnzyyslnop.supabase.co/functions/v1/gateway-relay
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      REMOTE_ACTOR: '@Mastodon@mastodon.social'
    steps:
      - uses: actions/checkout@v5

      - name: Validate production federation contract
        run: |
          set -euo pipefail
          test -s supabase/functions/gateway-relay/index.ts
          test -s supabase/migrations/20260907210000_federation_core.sql
          grep -Fq 'federation_outbox' supabase/functions/gateway-relay/index.ts
          grep -Fq 'RSASSA-PKCS1-v1_5' supabase/functions/gateway-relay/index.ts
          grep -Fq 'WebFinger' supabase/functions/gateway-relay/index.ts

      - name: Gateway health
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/gateway-health.json -w '%{http_code}' --max-time 20 "$GATEWAY_URL")"
          cat /tmp/gateway-health.json
          test "$status" = 200
          grep -Fq '"ok":true' /tmp/gateway-health.json
          grep -Fq '"activityPub":true' /tmp/gateway-health.json

      - name: WebFinger remote actor discovery
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/webfinger.json -w '%{http_code}' --max-time 20 'https://mastodon.social/.well-known/webfinger?resource=acct:Mastodon@mastodon.social')"
          cat /tmp/webfinger.json
          test "$status" = 200
          jq -e '.subject and (.links | map(select(.rel == "self")) | length > 0)' /tmp/webfinger.json

      - name: Create isolated authenticated Testagram actor
        run: |
          set -euo pipefail
          RUN="${GITHUB_RUN_ID}-${RANDOM}"
          EMAIL="fediverse-e2e-${RUN}@example.invalid"
          PASS="TgFed-${RUN}-X9!"
          USER_ID=""
          TOKEN=""
          cleanup() {
            if [ -n "$USER_ID" ]; then
              curl -sS -o /dev/null --max-time 15 -X DELETE "$SUPABASE_URL/auth/v1/admin/users/$USER_ID" -H "apikey: $SUPABASE_SECRET_KEY" || true
            fi
          }
          trap cleanup EXIT
          create_status="$(curl -sS --fail-with-body -o /tmp/create-user.json -w '%{http_code}' -X POST "$SUPABASE_URL/auth/v1/admin/users" -H "apikey: $SUPABASE_SECRET_KEY" -H 'Content-Type: application/json' --data "$(jq -nc --arg e "$EMAIL" --arg p "$PASS" '{email:$e,password:$p,email_confirm:true}')")"
          test "$create_status" = 200
          USER_ID="$(jq -r '.id' /tmp/create-user.json)"
          test -n "$USER_ID"
          login_status="$(curl -sS --fail-with-body -o /tmp/login.json -w '%{http_code}' -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' --data "$(jq -nc --arg e "$EMAIL" --arg p "$PASS" '{email:$e,password:$p}')")"
          test "$login_status" = 200
          TOKEN="$(jq -r '.access_token' /tmp/login.json)"
          test -n "$TOKEN"

          echo "Calling gateway-relay to provision actor and resolve remote actor..."
          invoke() {
            curl -sS --fail-with-body -X POST "$GATEWAY_URL" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$1"
          }
          invoke '{"path":"/health"}' >/tmp/invoke-health.json
          jq -e '.ok == true and .activityPub == true' /tmp/invoke-health.json

          invoke "$(jq -nc --arg path "/follow" --arg target "$REMOTE_ACTOR" '{path:$path,body:{target:$target}}')" >/tmp/follow.json || {
            cat /tmp/follow.json || true
            exit 1
          }
          cat /tmp/follow.json
          jq -e '.activity.type == "Follow" and .activity.object' /tmp/follow.json
          ACTIVITY_ID="$(jq -r '.activityId' /tmp/follow.json)"
          test -n "$ACTIVITY_ID"

          echo 'Verifying durable outbox record...'
          curl -sS --fail-with-body "$SUPABASE_URL/rest/v1/federation_outbox?activity_id=eq.$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$ACTIVITY_ID")&select=status,activity_type,http_status,attempts" \
            -H "apikey: $SUPABASE_SECRET_KEY" >/tmp/outbox.json
          cat /tmp/outbox.json
          jq -e 'length == 1 and .[0].activity_type == "Follow" and .[0].attempts == 1' /tmp/outbox.json

          echo 'PASS: WebFinger + authenticated gateway + signed Follow + durable outbox.'
