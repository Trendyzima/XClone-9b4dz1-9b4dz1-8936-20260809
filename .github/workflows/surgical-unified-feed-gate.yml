# one-shot gate: source edits are committed only after typecheck + production build pass
name: Surgical unified feed gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surgical-unified-feed-gate
  cancel-in-progress: true

jobs:
  repair-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply surgical unified-feed wiring
        shell: python
        run: |
          from pathlib import Path
          import re

          home = Path('src/pages/HomePage.tsx')
          text = home.read_text()

          old_import = "import { buildFollowingFeed } from '@/services/recommendations';"
          new_import = "import { getUnifiedFeed } from '@/services/feed';"
          assert old_import in text, 'HomePage: expected recommendations import not found'
          text = text.replace(old_import, new_import, 1)

          unified = """  const fetchUnifiedForYouFeed = async (): Promise<FeedItem[]> => {
    try {
      const result = await getUnifiedFeed({ mode: 'home', limit: PAGE_SIZE });
      return result.posts.map((post: any) => ({
        type: post.origin === 'federated' ? 'fedpost' as const : 'post' as const,
        data: post,
      }));
    } catch (err) {
      console.warn('[feed] unified home feed failed:', err);
      return [];
    }
  };"""
          pattern = r"  const fetchUnifiedForYouFeed = async \(\): Promise<FeedItem\[\]> => \{.*?\n\n  const fetchInitialFeed"
          replacement = unified + "\n\n  const fetchInitialFeed"
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          assert count == 1, 'HomePage: unified For You function replacement failed'

          following = """    } else if (activeTab === 'following' && user) {
      try {
        const result = await getUnifiedFeed({ mode: 'following', limit: PAGE_SIZE });
        const filtered = result.posts
          .filter((post: any) => {
            const uid = post.user_id ?? post.author?.id ?? post.author?.user_id;
            return !uid || !blockedUserIds.includes(uid);
          })
          .map((post: any) => ({
            type: post.origin === 'federated' ? 'fedpost' as const : 'post' as const,
            data: post,
          }));
        setFeedItems(filtered);
        const last = result.posts.at(-1);
        setFeedCursor(last?.created_at ?? null);
        setFeedHasMore(result.posts.length >= PAGE_SIZE);
      } catch (err) {
        console.warn('[feed] unified following feed failed:', err);
        setFeedItems([]);
        setFeedHasMore(false);
      }
    } else {
      const items = activeTab === 'foryou'"""
          pattern = r"    \} else if \(activeTab === 'following' && user\) \{.*?\n    \} else \{\n      const items = activeTab === 'foryou'"
          text, count = re.subn(pattern, following, text, count=1, flags=re.S)
          assert count == 1, 'HomePage: Following branch replacement failed'
          home.write_text(text)

          feed = Path('supabase/functions/feed-fast/index.ts')
          text = feed.read_text()
          old_cache = "'Cache-Control': 'public, max-age=5, s-maxage=10, stale-while-revalidate=30'"
          new_cache = "'Cache-Control': 'private, no-store'"
          assert old_cache in text, 'feed-fast: public cache header not found'
          feed.write_text(text.replace(old_cache, new_cache, 1))

          explore = Path('src/pages/ExplorePage.tsx')
          text = explore.read_text()
          marker = "import { ShoppingBag, Star as StarIcon, Heart as HeartIcon, MapPin as MapPinIcon, BadgeCheck as BadgeCheckIcon, ExternalLink as ExtLinkIcon } from 'lucide-react';"
          assert marker in text, 'ExplorePage: import marker not found'
          assert "@/components/features/UnifiedExploreFeed" not in text, 'ExplorePage already wired'
          text = text.replace(marker, marker + "\nimport { UnifiedExploreFeed } from '@/components/features/UnifiedExploreFeed';", 1)
          topbar = '<TopBar title="Explore" showProfile={false} />'
          assert topbar in text, 'ExplorePage: TopBar marker not found'
          text = text.replace(topbar, topbar + "\n\n      {activeTab === 'Explore' && <UnifiedExploreFeed />}", 1)
          explore.write_text(text)

          print('Surgical source edits applied.')

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Inspect changed surface
        run: |
          git diff --check
          git status --short
          git diff --stat
          grep -n "Cache-Control" supabase/functions/feed-fast/index.ts
          grep -n "getUnifiedFeed" src/pages/HomePage.tsx src/components/features/UnifiedExploreFeed.tsx
          grep -n "UnifiedExploreFeed" src/pages/ExplorePage.tsx

      - name: Commit only after verification passes
        shell: bash
        run: |
          rm -f .github/workflows/surgical-unified-feed-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/HomePage.tsx src/pages/ExplorePage.tsx src/components/features/UnifiedExploreFeed.tsx supabase/functions/feed-fast/index.ts .github/workflows/surgical-unified-feed-gate.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'feat: wire unified native and federated feeds'
          git push origin main
