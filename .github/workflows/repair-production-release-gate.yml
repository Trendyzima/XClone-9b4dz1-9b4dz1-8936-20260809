name: Repair production release gate concurrency

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify production gate concurrency is commit-scoped
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('.github/workflows/testagram-production-release.yml')
          s = p.read_text()
          repaired_re = re.compile(
              r"concurrency:\n"
              r"  group: testagram-production-release-\$\{\{ github\.sha \}\}\n"
              r"  cancel-in-progress: false"
          )
          legacy = "concurrency:\n  group: testagram-production-release\n  cancel-in-progress: true"
          repaired = "${" + "{ github.sha }}"
          replacement = "concurrency:\n  group: testagram-production-release-" + repaired + "\n  cancel-in-progress: false"

          if repaired_re.search(s):
              print('Production gate concurrency is already repaired.')
          elif legacy in s:
              p.write_text(s.replace(legacy, replacement, 1))
              print('Production gate concurrency repaired.')
          else:
              block_start = s.find('concurrency:')
              block = s[block_start:block_start + 180] if block_start >= 0 else '<missing>'
              raise SystemExit(
                  'production gate concurrency block is neither legacy nor repaired form; '
                  f'actual block={block!r}'
              )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/testagram-production-release.yml
          if git diff --cached --quiet; then
            echo 'No production gate workflow change required.'
          else
            git commit -m 'Make production release gate concurrency commit-scoped'
            git push origin HEAD:main
          fi

      - name: Dispatch repaired production release gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$REPO/actions/workflows/testagram-production-release.yml/dispatches" \
            -f ref=main

      - name: Remove one-time repair workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/repair-production-release-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/repair-production-release-gate.yml
          git commit -m 'Remove one-time production gate repair workflow'
          git push origin HEAD:main
