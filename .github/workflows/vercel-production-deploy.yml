name: Testagram Vercel Production Deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Immutable release commit to deploy'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'index.html'

permissions:
  contents: read

concurrency:
  group: testagram-vercel-production-${{ inputs.release_sha || github.sha }}
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.release_sha || github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 1

      - name: Verify deployment release identity
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$RELEASE_SHA"
          echo "Vercel deployment release commit=$actual"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate Vercel deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=(VERCEL_TOKEN)
          [ -n "$VERCEL_ORG_ID" ] || missing+=(VERCEL_ORG_ID)
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=(VERCEL_PROJECT_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Vercel production deployment is blocked. Missing GitHub secret value(s): %s\n' "${missing[*]}"
            exit 1
          fi
          echo 'Vercel deployment credentials are present.'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Bind deployment to the exact Vercel project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"'"$VERCEL_ORG_ID"'","projectId":"'"$VERCEL_PROJECT_ID"'"}' > .vercel/project.json
          cat .vercel/project.json

      - name: Pull Vercel Production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          test -s .vercel/.env.production.local
          echo 'Vercel Production environment was pulled for the build.'
          if grep -Eq '^(VITE_SUPABASE_URL|VITE_SUPABASE_PUBLISHABLE_KEY|VITE_SUPABASE_ANON_KEY)=' .vercel/.env.production.local; then
            echo 'Required Supabase build variables are present in the pulled Vercel Production environment.'
          else
            echo 'ERROR: Vercel Production is missing VITE_SUPABASE_URL and/or VITE_SUPABASE_PUBLISHABLE_KEY (or VITE_SUPABASE_ANON_KEY).'
            exit 1
          fi

      - name: Build production bundle with Vercel Production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"

      - name: Verify Vite output is a compiled deployment
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          if grep -q '/src/main.jsx' dist/index.html; then
            echo 'ERROR: dist/index.html still points at raw Vite source.'
            exit 1
          fi
          grep -Eq 'src="/assets/[^" ]+\.js"' dist/index.html

      - name: Deploy exact production bundle to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
