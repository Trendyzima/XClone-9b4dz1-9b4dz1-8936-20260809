name: Testagram Canonical Cloudflare Worker

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Testagram Cloudflare Backend
      - Testagram Cloudflare Federation Hardening
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'cloudflare/worker/production-entrypoint.ts'
      - 'cloudflare/worker/paypal.ts'
      - 'cloudflare/worker/public-actor-entrypoint.ts'
      - 'cloudflare/worker/federation-entrypoint.ts'
      - 'cloudflare/worker/index.ts'
      - 'cloudflare/wrangler.jsonc'
      - 'cloudflare/wrangler-federation.jsonc'
      - '.github/workflows/canonical-cloudflare-worker.yml'

permissions:
  contents: read

env:
  WRANGLER_VERSION: '4.126.0'
  SUPABASE_URL: 'https://zcjtvykwwplnzyyslnop.supabase.co'
  SUPABASE_PROJECT_REF: 'zcjtvykwwplnzyyslnop'
  WORKER_HEALTH_URL: 'https://federation.testagram.site/api/health'
  PRODUCTION_HEALTH_URL: 'https://api.testagram.site/api/health'

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate canonical worker source
        run: |
          set -euo pipefail
          test -s cloudflare/worker/production-entrypoint.ts
          test -s cloudflare/worker/paypal.ts
          test -s cloudflare/worker/public-actor-entrypoint.ts
          test -s cloudflare/worker/federation-entrypoint.ts
          test -s cloudflare/worker/index.ts
          grep -Fq '"main": "./worker/production-entrypoint.ts"' cloudflare/wrangler.jsonc
          grep -Fq '"main": "./worker/production-entrypoint.ts"' cloudflare/wrangler-federation.jsonc
          grep -Fq 'federation.testagram.site' cloudflare/wrangler.jsonc
          grep -Fq 'https://federation.testagram.site' cloudflare/worker/public-actor-entrypoint.ts
      - name: Resolve deployment secrets without printing them
        env:
          SUPABASE_PUBLISHABLE_KEY_INPUT: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY_INPUT: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY_INPUT: ${{ secrets.SUPABASE_SECRET_KEY }}
          PAYPAL_CLIENT_ID_INPUT: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_ID_SANDBOX_INPUT: ${{ secrets.PAYPAL_CLIENT_ID_SANDBOX }}
          PAYPAL_CLIENT_SECRET_INPUT: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_CLIENT_SECRET_SANDBOX_INPUT: ${{ secrets.PAYPAL_CLIENT_SECRET_SANDBOX }}
          PAYPAL_WEBHOOK_ID_INPUT: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          PAYPAL_WEBHOOK_ID_SANDBOX_INPUT: ${{ secrets.PAYPAL_WEBHOOK_ID_SANDBOX }}
        run: |
          set -euo pipefail
          anon="${SUPABASE_PUBLISHABLE_KEY_INPUT:-}"
          [ -n "$anon" ] || anon="${SUPABASE_ANON_KEY_INPUT:-}"
          client_id="${PAYPAL_CLIENT_ID_INPUT:-}"
          [ -n "$client_id" ] || client_id="${PAYPAL_CLIENT_ID_SANDBOX_INPUT:-}"
          client_secret="${PAYPAL_CLIENT_SECRET_INPUT:-}"
          [ -n "$client_secret" ] || client_secret="${PAYPAL_CLIENT_SECRET_SANDBOX_INPUT:-}"
          webhook_id="${PAYPAL_WEBHOOK_ID_INPUT:-}"
          [ -n "$webhook_id" ] || webhook_id="${PAYPAL_WEBHOOK_ID_SANDBOX_INPUT:-}"
          test -n "$anon"
          test -n "${SUPABASE_SECRET_KEY_INPUT:-}"
          test -n "$client_id"
          test -n "$client_secret"
          test -n "$webhook_id"
          {
            printf 'SUPABASE_ANON_KEY=%s\n' "$anon"
            printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY_INPUT"
            printf 'PAYPAL_CLIENT_ID=%s\n' "$client_id"
            printf 'PAYPAL_CLIENT_SECRET=%s\n' "$client_secret"
            printf 'PAYPAL_WEBHOOK_ID=%s\n' "$webhook_id"
          } > "$RUNNER_TEMP/paypal-secrets"
      - name: Deploy canonical Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config cloudflare/wrangler.jsonc --secrets-file "$RUNNER_TEMP/paypal-secrets"
          rm -f "$RUNNER_TEMP/paypal-secrets"
      - name: Verify canonical health and federation
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            status="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$WORKER_HEALTH_URL" || true)"
            if [ "$status" = 200 ] && jq -e '.ok == true and .federation == true and .databaseReachable == true and .jwksReachable == true and .r2Binding == true' /tmp/health.json >/dev/null 2>&1; then break; fi
            test "$attempt" -eq 12 && { cat /tmp/health.json || true; exit 1; }
            sleep 5
          done
          cat /tmp/health.json
      - name: Verify PayPal configuration endpoint
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/paypal-config.json -w '%{http_code}' --max-time 20 'https://testagram-api.nahashonnyaga794.workers.dev/api/paypal/config' || true)"
          cat /tmp/paypal-config.json
          test "$status" = 200
          jq -e '.ok == true and .provider == "paypal" and .environment == "sandbox" and .configured == true' /tmp/paypal-config.json >/dev/null
      - name: Verify federation custom domain identity
        run: |
          set -euo pipefail
          test "$(curl -sS --fail-with-body --max-time 20 "$WORKER_HEALTH_URL" | jq -r '.federationDomain')" = 'federation.testagram.site'
          status="$(curl -sS -o /tmp/webfinger.json -w '%{http_code}' --max-time 20 'https://federation.testagram.site/.well-known/webfinger?resource=acct:health@federation.testagram.site' || true)"
          cat /tmp/webfinger.json
          test "$status" = 404
          grep -q 'actor not found' /tmp/webfinger.json
      - name: Verify production custom domain (non-blocking if Cloudflare challenge is enabled)
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/production-health.json -w '%{http_code}' --max-time 20 "$PRODUCTION_HEALTH_URL" || true)
          cat /tmp/production-health.json
          if [ "$status" = 200 ] && jq -e '.ok == true and .federation == true and .databaseReachable == true and .jwksReachable == true and .r2Binding == true' /tmp/production-health.json >/dev/null 2>&1; then
            echo 'Existing API custom domain health is directly reachable.'
          elif grep -qiE 'Just a moment|challenge|cf-chl|Enable JavaScript and cookies' /tmp/production-health.json; then
            echo 'Existing API custom domain remains browser-challenge protected; federation uses federation.testagram.site.'
          else
            echo "Existing API custom domain returned HTTP $status; federation uses federation.testagram.site."
          fi
