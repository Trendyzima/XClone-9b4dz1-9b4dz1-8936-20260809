name: Testagram Canonical Cloudflare Worker

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Testagram Cloudflare Backend
      - Testagram Cloudflare Federation Hardening
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'cloudflare/worker/production-entrypoint.ts'
      - 'cloudflare/worker/paypal.ts'
      - 'cloudflare/worker/public-actor-entrypoint.ts'
      - 'cloudflare/worker/federation-entrypoint.ts'
      - 'cloudflare/worker/index.ts'
      - 'cloudflare/wrangler.jsonc'
      - 'cloudflare/wrangler-federation.jsonc'
      - '.github/workflows/canonical-cloudflare-worker.yml'
      - '.github/workflows/paypal-wallet-e2e.yml'

permissions:
  contents: read

env:
  WRANGLER_VERSION: '4.126.0'
  WORKER_DIRECT_URL: 'https://testagram-api.nahashonnyaga794.workers.dev'
  PAYPAL_CONFIG_URL: 'https://testagram-api.nahashonnyaga794.workers.dev/api/paypal/config'
  FEDERATION_URL: 'https://federation.testagram.site'
  FEDERATION_HOST: 'federation.testagram.site'

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate canonical worker source
        run: |
          set -euo pipefail
          test -s cloudflare/worker/production-entrypoint.ts
          test -s cloudflare/worker/paypal.ts
          test -s cloudflare/worker/public-actor-entrypoint.ts
          test -s cloudflare/worker/federation-entrypoint.ts
          test -s cloudflare/worker/index.ts
          grep -Fq '"main": "./worker/production-entrypoint.ts"' cloudflare/wrangler.jsonc
          grep -Fq '"main": "./worker/production-entrypoint.ts"' cloudflare/wrangler-federation.jsonc
      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing GitHub secret: CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Validate PayPal sandbox credential set
        env:
          PAYPAL_CLIENT_ID_PRIMARY: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_ID_SANDBOX: ${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET_PRIMARY: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_CLIENT_SECRET_SANDBOX: ${{ secrets.PAYPAL_SANDBOX_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID_PRIMARY: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          PAYPAL_WEBHOOK_ID_SANDBOX: ${{ secrets.PAYPAL_WEBHOOK_ID_SANDBOX }}
        run: |
          set -euo pipefail
          client_id="${PAYPAL_CLIENT_ID_PRIMARY:-${PAYPAL_CLIENT_ID_SANDBOX:-}}"
          client_secret="${PAYPAL_CLIENT_SECRET_PRIMARY:-${PAYPAL_CLIENT_SECRET_SANDBOX:-}}"
          webhook_id="${PAYPAL_WEBHOOK_ID_PRIMARY:-${PAYPAL_WEBHOOK_ID_SANDBOX:-}}"
          missing=()
          [ -n "$client_id" ] || missing+=(PAYPAL_CLIENT_ID)
          [ -n "$client_secret" ] || missing+=(PAYPAL_CLIENT_SECRET)
          [ -n "$webhook_id" ] || missing+=(PAYPAL_WEBHOOK_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'PayPal sandbox configuration is incomplete. Missing GitHub secret value(s): %s\n' "${missing[*]}"
            exit 1
          fi
          echo 'PayPal sandbox credential set is complete.'
      - name: Deploy canonical Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config cloudflare/wrangler.jsonc
      - name: Synchronize PayPal secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYPAL_CLIENT_ID_PRIMARY: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_ID_SANDBOX: ${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET_PRIMARY: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_CLIENT_SECRET_SANDBOX: ${{ secrets.PAYPAL_SANDBOX_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID_PRIMARY: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          PAYPAL_WEBHOOK_ID_SANDBOX: ${{ secrets.PAYPAL_WEBHOOK_ID_SANDBOX }}
        run: |
          set -euo pipefail
          client_id="${PAYPAL_CLIENT_ID_PRIMARY:-${PAYPAL_CLIENT_ID_SANDBOX:-}}"
          client_secret="${PAYPAL_CLIENT_SECRET_PRIMARY:-${PAYPAL_CLIENT_SECRET_SANDBOX:-}}"
          webhook_id="${PAYPAL_WEBHOOK_ID_PRIMARY:-${PAYPAL_WEBHOOK_ID_SANDBOX:-}}"
          printf '%s' "$client_id" | npx --yes wrangler@${WRANGLER_VERSION} secret put PAYPAL_CLIENT_ID --config cloudflare/wrangler.jsonc
          printf '%s' "$client_secret" | npx --yes wrangler@${WRANGLER_VERSION} secret put PAYPAL_CLIENT_SECRET --config cloudflare/wrangler.jsonc
          printf '%s' "$webhook_id" | npx --yes wrangler@${WRANGLER_VERSION} secret put PAYPAL_WEBHOOK_ID --config cloudflare/wrangler.jsonc
      - name: Configure federation security exception
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zone_json="$(curl -fsS "$api/zones?name=testagram.site&status=active&per_page=1" "${auth[@]}")"
          echo "$zone_json" | jq -e '.success == true and (.result | length) == 1' >/dev/null
          zone_id="$(echo "$zone_json" | jq -r '.result[0].id')"
          echo "Cloudflare zone resolved for federation host: $zone_id"

          bot_status="$(curl -sS -o /tmp/bot-management.json -w '%{http_code}' "$api/zones/$zone_id/bot_management" "${auth[@]}" || true)"
          echo "Bot-management HTTP status: $bot_status"
          if [ "$bot_status" = 200 ]; then
            jq '{fight_mode, sbfm_likely_automated, sbfm_definitely_automated, sbfm_verified_bots, sbfm_static_resource_protection}' /tmp/bot-management.json || true
          else
            cat /tmp/bot-management.json || true
          fi

          entry_status="$(curl -sS -o /tmp/custom-entrypoint.json -w '%{http_code}' "$api/zones/$zone_id/rulesets/phases/http_request_firewall_custom/entrypoint" "${auth[@]}" || true)"
          echo "Custom-rules entrypoint HTTP status: $entry_status"
          if [ "$entry_status" = 200 ]; then
            ruleset_id="$(jq -r '.result.id // empty' /tmp/custom-entrypoint.json)"
          elif [ "$entry_status" = 404 ]; then
            create_status="$(curl -sS -o /tmp/custom-entrypoint-created.json -w '%{http_code}' "$api/zones/$zone_id/rulesets" --request POST "${auth[@]}" --data @- <<'JSON'
          {
            "name": "Testagram federation custom security",
            "description": "Zone-level custom rules for Testagram federation automation",
            "kind": "zone",
            "version": "1",
            "phase": "http_request_firewall_custom",
            "rules": []
          }
          JSON
          )"
            echo "Custom-rules entrypoint create HTTP status: $create_status"
            cat /tmp/custom-entrypoint-created.json
            jq -e '.success == true and .result.id' /tmp/custom-entrypoint-created.json >/dev/null
            ruleset_id="$(jq -r '.result.id' /tmp/custom-entrypoint-created.json)"
          else
            cat /tmp/custom-entrypoint.json || true
            exit 1
          fi
          test -n "$ruleset_id"

          existing="$(jq -r '.result.rules[]? | select(.description == "Testagram federation automation bypass") | .id' /tmp/custom-entrypoint.json 2>/dev/null | head -n1 || true)"
          if [ -z "$existing" ]; then
            rule_status="$(curl -sS -o /tmp/federation-skip-rule.json -w '%{http_code}' "$api/zones/$zone_id/rulesets/$ruleset_id/rules" --request POST "${auth[@]}" --data @- <<'JSON'
          {
            "action": "skip",
            "action_parameters": {
              "phases": ["http_ratelimit", "http_request_firewall_managed", "http_request_sbfm"],
              "products": ["bic", "securityLevel", "uaBlock", "waf", "zoneLockdown"]
            },
            "expression": "http.host eq \"federation.testagram.site\"",
            "description": "Testagram federation automation bypass",
            "enabled": true
          }
          JSON
          )"
            echo "Federation security-exception HTTP status: $rule_status"
            cat /tmp/federation-skip-rule.json
            jq -e '.success == true' /tmp/federation-skip-rule.json >/dev/null
          else
            echo "Federation automation bypass already exists: $existing"
          fi

          echo 'Federation security exception is configured only for federation.testagram.site.'
      - name: Verify canonical Worker health
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            status="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$WORKER_DIRECT_URL/api/health" || true)"
            cat /tmp/health.json || true
            if [ "$status" = 200 ] && jq -e '.ok == true and .databaseReachable == true and .jwksReachable == true and .r2Binding == true' /tmp/health.json >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
      - name: Verify federation custom domain health
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            status="$(curl -sS -D /tmp/federation-headers.txt -o /tmp/federation-health.json -w '%{http_code}' --max-time 20 "$FEDERATION_URL/api/health" || true)"
            echo "Federation custom-domain HTTP status: $status"
            echo '--- response headers ---'
            cat /tmp/federation-headers.txt || true
            echo '--- response body ---'
            cat /tmp/federation-health.json || true
            if [ "$status" = 200 ] && jq -e '.ok == true and .federation == true and .federationDomain == "federation.testagram.site"' /tmp/federation-health.json >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
      - name: Verify PayPal configuration
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/paypal-config.json -w '%{http_code}' --max-time 20 "$PAYPAL_CONFIG_URL" || true)"
          cat /tmp/paypal-config.json || true
          test "$status" = 200
          jq -e '.ok == true and .provider == "paypal" and .environment == "sandbox" and .configured == true' /tmp/paypal-config.json >/dev/null
