name: Testagram Direct Actor Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/federation-direct-actor-smoke.yml'
      - 'cloudflare/worker/public-actor-entrypoint.ts'
      - 'cloudflare/worker/federation-interop-entrypoint.ts'
      - 'cloudflare/wrangler-federation.jsonc'
      - 'cloudflare/wrangler.jsonc'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify canonical public actor
        env:
          SUPABASE_URL: https://aepbqfrmheihfsauzcby.supabase.co
          GATEWAY_URL: https://aepbqfrmheihfsauzcby.supabase.co/functions/v1/gateway-relay
          FEDERATION_ORIGIN: https://federation.testagram.site
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          RUN="${GITHUB_RUN_ID}-${RANDOM}"; EMAIL="fedi-actor-${RUN}@example.invalid"; PASS="TgActor-${RUN}-X9!"; USER_ID=""
          trap 'test -z "$USER_ID" || curl -sS -o /dev/null -X DELETE "$SUPABASE_URL/auth/v1/admin/users/$USER_ID" -H "apikey: $SUPABASE_SECRET_KEY" || true' EXIT
          curl -sS --fail-with-body -X POST "$SUPABASE_URL/auth/v1/admin/users" -H "apikey: $SUPABASE_SECRET_KEY" -H 'Content-Type: application/json' -d "$(jq -nc --arg e "$EMAIL" --arg p "$PASS" '{email:$e,password:$p,email_confirm:true}')" >/tmp/user.json
          USER_ID="$(jq -r '.id' /tmp/user.json)"
          TOKEN="$(curl -sS --fail-with-body -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' -d "$(jq -nc --arg e "$EMAIL" --arg p "$PASS" '{email:$e,password:$p}')" | jq -r '.access_token')"
          status="$(curl -sS -o /tmp/follow.json -w '%{http_code}' --max-time 60 -X POST "$GATEWAY_URL" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"path":"/follow","body":{"target":"@Mastodon@mastodon.social"}}')"
          echo "follow HTTP $status"; cat /tmp/follow.json
          test "$status" -ge 200 && test "$status" -lt 300
          ACTOR="$(curl -sS --fail-with-body "$SUPABASE_URL/rest/v1/federation_actors?user_id=eq.$USER_ID&select=actor_url" -H "apikey: $SUPABASE_SECRET_KEY" | jq -r '.[0].actor_url')"
          echo "actor URL: $ACTOR"
          test "$ACTOR" = "${FEDERATION_ORIGIN}/users/$(curl -sS --fail-with-body "$SUPABASE_URL/rest/v1/federation_actors?user_id=eq.$USER_ID&select=username" -H "apikey: $SUPABASE_SECRET_KEY" | jq -r '.[0].username')"
          status="$(curl -sS -o /tmp/actor.json -D /tmp/headers -w '%{http_code}' --max-time 30 -H 'Accept: application/activity+json' "$ACTOR")"
          echo "actor HTTP $status"; cat /tmp/headers; cat /tmp/actor.json
          test "$status" = 200
          jq -e --arg key "${ACTOR}#main-key" --arg inbox "${ACTOR}/inbox" '.id == $actor and .type == "Person" and .publicKey.id == $key and .publicKey.owner == .id and .inbox == $inbox and (.publicKey.publicKeyPem | startswith("-----BEGIN PUBLIC KEY-----"))' --arg actor "$ACTOR" /tmp/actor.json
          echo 'Canonical federation actor smoke passed.'
