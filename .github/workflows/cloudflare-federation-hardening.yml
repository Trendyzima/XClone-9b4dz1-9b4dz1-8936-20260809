name: Testagram Cloudflare Federation Hardening

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/worker/federation-entrypoint.ts'
      - 'cloudflare/wrangler-federation.jsonc'
      - '.github/workflows/cloudflare-federation-hardening.yml'
      - 'supabase/migrations/*federation*'

permissions:
  contents: read

env:
  WRANGLER_VERSION: '4.126.0'
  SUPABASE_PROJECT_REF: 'zcjtvykwwplnzyyslnop'
  SUPABASE_URL: 'https://zcjtvykwwplnzyyslnop.supabase.co'
  FEDERATION_ORIGIN: 'https://federation.testagram.site'

jobs:
  deploy-and-harden:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Deploy federation-aware Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -n "$SUPABASE_SECRET_KEY"
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          printf 'SUPABASE_ANON_KEY=%s\nSUPABASE_SECRET_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_SECRET_KEY" > "$secrets_file"
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config cloudflare/wrangler-federation.jsonc --secrets-file "$secrets_file"
      - name: Disable Bot Fight Mode for federation compatibility
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          zone_json="$(curl -sS --fail-with-body -H "$auth" "https://api.cloudflare.com/client/v4/zones?name=testagram.site&status=active&per_page=1")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"$zone_json")"
          test -n "$zone_id"
          bot="$(curl -sS --fail-with-body -H "$auth" "https://api.cloudflare.com/client/v4/zones/${zone_id}/bot_management")"
          if jq -e '.result.fight_mode == true' <<<"$bot" >/dev/null; then
            curl -sS --fail-with-body -X PUT -H "$auth" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/${zone_id}/bot_management" --data '{"fight_mode":false}'
          fi
      - name: Configure public federation WAF bypass
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          zone_json="$(curl -sS --fail-with-body -H "$auth" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones?name=testagram.site&status=active&per_page=1")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"$zone_json")"
          test -n "$zone_id"
          ep="https://api.cloudflare.com/client/v4/zones/${zone_id}/rulesets/phases/http_request_firewall_custom/entrypoint"
          entry="$(curl -sS -H "$auth" -H 'Content-Type: application/json' "$ep")"
          ruleset_id="$(jq -r '.result.id // empty' <<<"$entry")"
          expression='(http.host eq "federation.testagram.site") and (starts_with(http.request.uri.path, "/.well-known/") or starts_with(http.request.uri.path, "/users/") or starts_with(http.request.uri.path, "/nodeinfo/") or http.request.uri.path eq "/api/health")'
          rule="$(jq -nc --arg expr "$expression" '{ref:"testagram_federation_public",description:"Skip security controls for public federation endpoints",expression:$expr,action:"skip",action_parameters:{phases:["http_request_sbfm","http_request_firewall_managed"],products:["securityLevel","bic"]}}')"
          if [ -z "$ruleset_id" ]; then
            payload="$(jq -nc --argjson rule "$rule" '{name:"Testagram federation public endpoints",description:"Allow ActivityPub WebFinger NodeInfo and public actor traffic without browser challenges",kind:"zone",phase:"http_request_firewall_custom",rules:[$rule]}')"
            curl -sS --fail-with-body -X POST -H "$auth" -H 'Content-Type: application/json' "$ep" --data "$payload"
          else
            existing_rule_id="$(jq -r '.result.rules[]? | select(.ref == "testagram_federation_public") | .id' <<<"$entry" | head -n1)"
            if [ -n "$existing_rule_id" ]; then
              curl -sS --fail-with-body -X PATCH -H "$auth" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/${zone_id}/rulesets/${ruleset_id}/rules/${existing_rule_id}" --data "$rule"
            else
              curl -sS --fail-with-body -X POST -H "$auth" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/${zone_id}/rulesets/${ruleset_id}/rules" --data "$rule"
            fi
          fi
      - name: Verify public federation endpoints
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -sS --fail-with-body --max-time 20 -H 'Accept: application/json' 'https://federation.testagram.site/.well-known/nodeinfo' >/tmp/nodeinfo-link.json && jq -e '.links | length > 0' /tmp/nodeinfo-link.json >/dev/null; then break; fi
            test "$attempt" -eq 12 && exit 1
            sleep 5
          done
          for attempt in $(seq 1 12); do
            if curl -sS --fail-with-body --max-time 20 'https://federation.testagram.site/nodeinfo/2.1' >/tmp/nodeinfo.json && jq -e '.protocols | index("activitypub")' /tmp/nodeinfo.json >/dev/null; then break; fi
            test "$attempt" -eq 12 && exit 1
            sleep 5
          done
          status="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 'https://federation.testagram.site/api/health')"
          cat /tmp/health.json
          test "$status" = 200
          jq -e '.ok == true and .federation == true and .federationDomain == "federation.testagram.site"' /tmp/health.json
