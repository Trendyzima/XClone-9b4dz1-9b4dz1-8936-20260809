name: One-time home feed relation repair v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-home-feed-v2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch ambiguous profile embeds
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/pages/HomePage.tsx')
          s = p.read_text()
          old = s
          s = re.sub(r'user_profiles\(\*\)', 'user_profiles:profiles!posts_author_id_fkey(*)', s)
          s = re.sub(r'user_profiles\((id,\s*username,\s*avatar_url,\s*verified)\)', r'user_profiles:profiles!posts_author_id_fkey(\1)', s)
          if s == old:
              raise SystemExit('No ambiguous user_profiles embed found in HomePage.tsx')
          p.write_text(s)
          PY
      - name: Commit and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/HomePage.tsx
          git commit -m 'fix ambiguous profile relation in home feed'
          git rm .github/workflows/repair-home-feed-relations-v2.yml
          git commit -m 'remove one-time home feed repair v2'
          git push
